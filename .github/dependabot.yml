version: 2
updates:
  # npm workspaces — one entry at the root covers every workspace via the root lockfile.
  - package-ecosystem: npm
    directory: '/'
    schedule:
      interval: weekly
    open-pull-requests-limit: 10
    # Batch ALL update types (majors included) into two grouped PRs so we get a
    # couple of reviewable PRs a week instead of one per package.
    groups:
      dev-dependencies:
        dependency-type: development
      production-dependencies:
        dependency-type: production
    # Expo / React Native versions track the installed SDK. Let `expo install --fix`
    # own those majors (see CONTRIBUTING / examples) — Dependabot bumping them in
    # isolation would break SDK alignment. Security patches still come through as
    # minor/patch bumps within the current SDK.
    ignore:
      - dependency-name: expo
        update-types: [version-update:semver-major]
      - dependency-name: react
        update-types: [version-update:semver-major]
      - dependency-name: react-dom
        update-types: [version-update:semver-major]
      - dependency-name: react-native
        update-types: [version-update:semver-major]
      - dependency-name: react-native-*
        update-types: [version-update:semver-major]
      - dependency-name: '@types/react'
        update-types: [version-update:semver-major]

  # Docs site has its own lockfile outside the npm workspaces — without this entry
  # its dependencies (and their security alerts) never get update PRs.
  - package-ecosystem: npm
    directory: '/website'
    schedule:
      interval: weekly
    groups:
      website-dependencies:
        patterns: ['*']

  # Keep the GitHub Actions in ci.yml current (clears Node-runtime deprecations).
  - package-ecosystem: github-actions
    directory: '/'
    schedule:
      interval: weekly
    groups:
      github-actions:
        patterns: ['*']
